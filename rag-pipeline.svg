<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="100%" role="img" aria-label="RAG pipeline: hybrid retrieval, LLM answer with citations, Ragas scoring, CI gate" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker>
<path id="p1" d="M140 160 C170 160 170 98 200 98"/>
<path id="p2" d="M140 160 C170 160 170 222 200 222"/>
<path id="p3" d="M350 98 C385 98 385 160 420 160"/>
<path id="p4" d="M350 222 C385 222 385 160 420 160"/>
<path id="p5" d="M540 160 L600 160"/>
<path id="p6" d="M665 190 L665 250"/>
<path id="p7" d="M600 278 L540 278"/>
</defs>
<style>
.n{fill:#161b22;stroke:#30363d;stroke-width:1.5}
.t{font:600 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3;text-anchor:middle}
.s{font:400 11px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e;text-anchor:middle}
.h{font:700 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
.l{fill:none;stroke:#6e7681;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#ar);animation:d 1.2s linear infinite}
@keyframes d{to{stroke-dashoffset:-18}}
.pulse{animation:p 2.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.55}50%{opacity:1}}
</style>
<rect width="900" height="330" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="30" y="38" class="h">How my RAG system answers a question</text>
<g class="pulse"><rect x="640" y="20" width="230" height="26" rx="13" fill="#1c1236" stroke="#bc8cff"/><text x="755" y="38" class="s" style="fill:#d2b8ff">Langfuse traces every request</text></g>
<use href="#p1" class="l"/><use href="#p2" class="l"/><use href="#p3" class="l"/><use href="#p4" class="l"/><use href="#p5" class="l"/><use href="#p6" class="l"/><use href="#p7" class="l"/>
<rect class="n" x="30" y="130" width="110" height="60" rx="12" style="stroke:#58a6ff"/><text x="85" y="157" class="t">Your</text><text x="85" y="174" class="t">question</text>
<rect class="n" x="200" y="70" width="150" height="56" rx="12"/><text x="275" y="94" class="t">BM25</text><text x="275" y="111" class="s">keyword search</text>
<rect class="n" x="200" y="194" width="150" height="56" rx="12"/><text x="275" y="218" class="t">Chroma</text><text x="275" y="235" class="s">vector search</text>
<rect class="n" x="420" y="130" width="120" height="60" rx="12"/><text x="480" y="157" class="t">Merge</text><text x="480" y="174" class="s">&amp; rank results</text>
<rect class="n" x="600" y="130" width="130" height="60" rx="12" style="stroke:#58a6ff"/><text x="665" y="157" class="t">LLM answer</text><text x="665" y="174" class="s">with source citations</text>
<rect class="n" x="600" y="250" width="130" height="56" rx="12"/><text x="665" y="274" class="t">Ragas</text><text x="665" y="291" class="s">faithfulness &amp; relevancy</text>
<rect class="n" x="400" y="250" width="140" height="56" rx="12" style="stroke:#3fb950"/><text x="470" y="274" class="t">CI gate</text><text x="470" y="291" class="s">GitHub Actions</text>
<g class="pulse"><text x="300" y="283" class="t" style="fill:#3fb950;font-size:12px">blocks deploy if</text><text x="300" y="298" class="t" style="fill:#3fb950;font-size:12px">quality drops</text></g>
<g fill="#58a6ff">
<circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
<circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
<circle r="4"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
<circle r="4"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
</g>
<g fill="#bc8cff">
<circle r="4"><animateMotion dur="2s" begin="0.6s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
<circle r="4"><animateMotion dur="2s" begin="1.6s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle>
<circle r="4"><animateMotion dur="2s" begin="2.6s" repeatCount="indefinite"><mpath href="#p7"/></animateMotion></circle>
</g>
</svg>
