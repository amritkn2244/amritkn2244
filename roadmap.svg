<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" role="img" aria-label="Roadmap: Python, then DSA, then AI engineering" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><path id="r" d="M184 70 L416 70 M484 70 L716 70"/></defs>
<style>
.t{font:700 17px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3;text-anchor:middle}
.s{font:400 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e;text-anchor:middle}
.now{font:700 12px ui-monospace,Menlo,Consolas,monospace;fill:#3fb950;text-anchor:middle}
.ln{stroke:#30363d;stroke-width:3;stroke-dasharray:6 6;animation:d 1.5s linear infinite}
@keyframes d{to{stroke-dashoffset:-24}}
.ring{transform-origin:450px 70px;animation:rg 2s ease-out infinite}
@keyframes rg{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.7);opacity:0}}
</style>
<rect width="900" height="170" rx="16" fill="#0d1117" stroke="#30363d"/>
<line class="ln" x1="184" y1="70" x2="416" y2="70"/><line class="ln" x1="484" y1="70" x2="716" y2="70"/>
<circle cx="150" cy="70" r="34" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="150" y="76" class="t">Python</text>
<circle class="ring" cx="450" cy="70" r="34" fill="none" stroke="#3fb950" stroke-width="2"/>
<circle cx="450" cy="70" r="34" fill="#161b22" stroke="#3fb950" stroke-width="2.5"/><text x="450" y="76" class="t">DSA</text>
<circle cx="750" cy="70" r="34" fill="#161b22" stroke="#bc8cff" stroke-width="2"/><text x="750" y="76" class="t">AI</text>
<text x="150" y="132" class="s">the foundation</text>
<text x="450" y="132" class="now">● LEARNING NOW</text><text x="450" y="152" class="s">pattern-wise, for TCS NQT</text>
<text x="750" y="132" class="s">the long-run goal</text><text x="750" y="152" class="s">AI engineering</text>
<circle r="5" fill="#58a6ff"><animateMotion dur="3s" repeatCount="indefinite" path="M184 70 L416 70"/></circle>
<circle r="5" fill="#bc8cff"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M484 70 L716 70"/></circle>
</svg>
