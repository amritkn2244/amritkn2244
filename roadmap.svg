<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="100%" role="img" aria-label="Roadmap: Python, then DSA for TCS NQT and similar exams, then AI engineering" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="glow" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#7a5528" stop-opacity=".7"/><stop offset=".55" stop-color="#3a2a17" stop-opacity=".3"/><stop offset="1" stop-color="#171412" stop-opacity="0"/></radialGradient>
</defs>
<style>
.t{font:700 17px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f5efe6;text-anchor:middle}
.s{font:400 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#9a8a76;text-anchor:middle}
.k{font:600 12px ui-monospace,Menlo,Consolas,monospace;fill:#e8a857;text-anchor:middle;letter-spacing:1px}
.bar{font:500 11px ui-monospace,Menlo,Consolas,monospace;fill:#9a8a76;text-anchor:middle;letter-spacing:1px}
.ln{stroke:#5a4a36;stroke-width:3;stroke-dasharray:6 6;animation:d 1.5s linear infinite}
@keyframes d{to{stroke-dashoffset:-24}}
.ring{transform-origin:450px 102px;animation:rg 2s ease-out infinite}
@keyframes rg{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.7);opacity:0}}
</style>
<rect width="900" height="210" rx="16" fill="#171412"/>
<rect width="900" height="210" rx="16" fill="url(#glow)"/>
<g fill="#4a3d2e"><rect x="0" y="0" width="12" height="12" opacity=".6"/><rect x="12" y="12" width="12" height="12" opacity=".4"/><rect x="0" y="24" width="12" height="12" opacity=".25"/>
<rect x="888" y="198" width="12" height="12" opacity=".6"/><rect x="876" y="186" width="12" height="12" opacity=".4"/><rect x="888" y="174" width="12" height="12" opacity=".25"/></g>
<rect x="24" y="14" width="852" height="182" rx="12" fill="#0c0a09" stroke="#8a6a3c" stroke-opacity=".55"/>
<path d="M24 42 V26 a12 12 0 0 1 12 -12 H864 a12 12 0 0 1 12 12 V42 Z" fill="#3b322a"/>
<circle cx="44" cy="28" r="5.5" fill="#ff5f57"/><circle cx="62" cy="28" r="5.5" fill="#febc2e"/><circle cx="80" cy="28" r="5.5" fill="#28c840"/>
<text x="450" y="32" class="bar">ROADMAP</text>

<line class="ln" x1="184" y1="104" x2="416" y2="104"/><line class="ln" x1="484" y1="104" x2="716" y2="104"/>

<circle cx="150" cy="104" r="34" fill="#171210" stroke="#d9c3a0" stroke-width="2"/><text x="150" y="110" class="t">Python</text>
<circle class="ring" cx="450" cy="104" r="34" fill="none" stroke="#e8a857" stroke-width="2" style="transform-origin:450px 104px"/>
<circle cx="450" cy="104" r="34" fill="#171210" stroke="#e8a857" stroke-width="2.5"/><text x="450" y="110" class="t">DSA</text>
<circle cx="750" cy="104" r="34" fill="#171210" stroke="#f5efe6" stroke-width="2"/><text x="750" y="110" class="t">AI</text>

<text x="150" y="160" class="s">the foundation</text>
<text x="450" y="160" class="k">PATTERN-WISE</text><text x="450" y="180" class="s">TCS NQT · Infytq · Wipro NLTH &amp; similar exams</text>
<text x="750" y="160" class="s">the long-run goal</text><text x="750" y="180" class="s">AI engineering</text>

<circle r="5" fill="#d9c3a0"><animateMotion dur="3s" repeatCount="indefinite" path="M184 104 L416 104"/></circle>
<circle r="5" fill="#f5efe6"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M484 104 L716 104"/></circle>
</svg>
